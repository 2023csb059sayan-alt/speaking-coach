<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="1" stop-color="#18244a" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <!-- Header -->
  <rect x="40" y="40" width="1200" height="80" rx="12" fill="#111a33" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.3" />
  <text x="80" y="90" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#e2e8f0">Speaking Coach</text>
  <text x="80" y="112" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Conversation Practice</text>
  <!-- Main conversation area -->
  <rect x="40" y="160" width="1200" height="480" rx="16" fill="#111a33" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.2" />
  <!-- Messages -->
  <g font-family="system-ui, sans-serif" font-size="18">
    <!-- Coach message -->
    <rect x="80" y="200" width="500" height="80" rx="16" fill="#1e2a4a" />
    <text x="100" y="245" fill="#5eead4" font-size="14" font-weight="600">COACH</text>
    <text x="100" y="265" fill="#e2e8f0" font-size="16">"How was your weekend? Tell me about it in English."</text>
    <!-- User message -->
    <rect x="700" y="320" width="500" height="80" rx="16" fill="#2dd4bf" fill-opacity="0.2" />
    <text x="720" y="365" fill="#2dd4bf" font-size="14" font-weight="600">YOU</text>
    <text x="720" y="385" fill="#e2e8f0" font-size="16">"It was great! I went hiking with friends."</text>
    <!-- Coach response -->
    <rect x="80" y="440" width="500" height="80" rx="16" fill="#1e2a4a" />
    <text x="100" y="485" fill="#5eead4" font-size="14" font-weight="600">COACH</text>
    <text x="100" y="505" fill="#e2e8f0" font-size="16">"Great! 'Went' is correct past tense. Try: 'I went hiking...'"</text>
  </g>
  <!-- Bottom controls -->
  <rect x="500" y="680" width="280" height="60" rx="30" fill="#2dd4bf" />
  <circle cx="640" cy="710" r="18" fill="#0b1020" />
  <path d="M630 710 L638 718 L650 702" stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="640" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Hold to speak</text>
  <!-- Caption bar -->
  <rect x="80" y="580" width="1120" height="50" rx="10" fill="#0b1020" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3" />
  <text x="100" y="612" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">[Caption: "How was your weekend? Tell me about it in English."]</text>
</svg>