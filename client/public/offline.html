<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · Speaking Coach</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 1.5rem;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { color: #94a3b8; line-height: 1.6; margin: 0 0 1.5rem; }
      button {
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        border: 0;
        background: #2dd4bf;
        color: #0b1020;
        font-weight: 600;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        The coach needs a connection to transcribe what you say and to answer. Nothing you have practised is lost, and
        nothing is sent while you are offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
